# Blueprint triển khai 1-click lên Render.com (gói miễn phí).
# Xem hướng dẫn trong README.md, mục "Deploy nhanh lên Render.com".
services:
  - type: web
    name: bhxh-tra-cuu
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bhxh-tra-cuu-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN_TTL_SECONDS
        value: "43200"
      # Tự tạo 1 tài khoản admin đầu tiên khi server khởi động (không cần
      # Shell, vì gói Free có thể không có quyền dùng Shell). Chỉ chạy nếu
      # tài khoản với username này CHƯA tồn tại. Nhập giá trị trực tiếp
      # trong Render Dashboard (Environment) — không lưu trong file này.
      - key: ADMIN_BOOTSTRAP_USERNAME
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_FULL_NAME
        sync: false

databases:
  - name: bhxh-tra-cuu-db
    plan: free
    databaseName: bhxh_pro
    user: bhxh_pro
