<title>Bắt Thú Sao V1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: một màn hình dọc kiểu máy arcade, canvas ở giữa, hai nút A/B nằm đè ở đáy */
:root{
  --bg:#0c1030;
  --frame:#d92b2b;
  --frame-dark:#8f1414;
  --orange:#f59a2a;
  --ink:#16193a;
  --paper:#fff6e0;
  --pink:#ff6b8b;
  --font-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--paper);
  font-family:var(--font-display);
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;display:flex;justify-content:center;align-items:center;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
.cab{
  position:relative;aspect-ratio:3/5;
  height:min(100%,calc((100vw - 32px)*5/3));max-width:100%;
  background:var(--frame);border-radius:22px;padding:10px;box-sizing:border-box;
  box-shadow:0 0 0 4px var(--frame-dark),0 18px 40px #0008;
}
canvas{width:100%;height:100%;display:block;border-radius:12px;background:#000}
.btn{
  position:absolute;bottom:3.2%;width:17%;aspect-ratio:1;border-radius:50%;
  border:4px solid #fff;background:radial-gradient(circle at 35% 30%,#fff,#bcd3ff 55%,#6f8fd8);
  color:var(--ink);font:800 clamp(18px,5vw,30px) var(--font-display);cursor:pointer;
  box-shadow:0 6px 0 #3d5aa8,0 10px 14px #0006;
}
.btn:active,.btn.on{transform:translateY(5px);box-shadow:0 1px 0 #3d5aa8}
.btn:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
#bA{left:9%}#bB{right:9%}
.panel{
  position:absolute;inset:10px;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;text-align:center;
  background:#0a0d2ad9;padding:20px;box-sizing:border-box;overflow:auto;
}
.panel[hidden]{display:none}
.panel h1{margin:0;font-size:clamp(26px,7vw,40px);line-height:1.05;text-wrap:balance;color:var(--orange)}
.panel p{margin:0;max-width:30ch;line-height:1.35;font-size:clamp(14px,3.6vw,17px)}
.go{
  font:800 clamp(18px,5vw,24px) var(--font-display);padding:10px 28px;border-radius:999px;
  border:3px solid #fff;background:var(--orange);color:var(--ink);cursor:pointer;box-shadow:0 5px 0 #a35d0b;
}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #a35d0b}
.go:focus-visible{outline:3px solid #fff;outline-offset:3px}
.dex{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:32ch}
.chip{background:#ffffff1c;border-radius:999px;padding:2px 10px;font-size:13px}
.help{font-size:13px;opacity:.8}
@media (prefers-reduced-motion:reduce){.btn,.go{transition:none}}
</style>

<div class="cab" id="cab">
  <canvas id="cv" width="480" height="800" aria-label="Màn hình trò chơi"></canvas>
  <button class="btn" id="bA" aria-label="Nút A">A</button>
  <button class="btn" id="bB" aria-label="Nút B">B</button>
  <div class="panel" id="panel"></div>
</div>

<script>
(()=>{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=480,H=800,FONT="'Baloo 2','Trebuchet MS',sans-serif";
const panel=document.getElementById('panel');
const bA=document.getElementById('bA'),bB=document.getElementById('bB');

/* ---------- Dữ liệu thú ---------- */
const MONS=[
  {n:'Nguyệt Dơi',t:'bat',c1:'#5b3fc4',c2:'#ffd23f'},
  {n:'Hỏa Hồ',t:'fox',c1:'#ff7a2f',c2:'#ffe08a'},
  {n:'Lôi Thử',t:'mouse',c1:'#ffd83a',c2:'#e0392b'},
  {n:'Thủy Rùa',t:'turtle',c1:'#3aa0d8',c2:'#e8d9a0'},
  {n:'Ếch Ninja',t:'frog',c1:'#1d4fd8',c2:'#ff8fa3'}
];
const PLAYER={n:'Ếch Ninja',t:'frog',c1:'#1d4fd8',c2:'#ff8fa3'};
const RAINBOW=['#ff4b4b','#ff9a2a','#ffe53a','#4bd16a','#3aa0ff'];

/* ---------- Lưu bộ sưu tập ---------- */
let dex={};
try{dex=JSON.parse(localStorage.getItem('bts_v1')||'{}')}catch(e){}
const saveDex=()=>{try{localStorage.setItem('bts_v1',JSON.stringify(dex))}catch(e){}};

/* ---------- Âm thanh ---------- */
let ac=null;
function beep(f,d=.08,type='square',v=.05,slide=0){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),ac.currentTime+d);
    g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}

/* ---------- Vẽ hình ---------- */
function star(x,y,r,col,rot=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();
  for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}
  ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#0006';ctx.stroke();ctx.restore();
}
function ell(x,y,rx,ry,fill,stroke){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=3;ctx.strokeStyle=stroke;ctx.stroke()}}
function eye(x,y,r,col){ell(x,y,r,r*1.2,'#fff');ell(x+r*.2,y,r*.55,r*.8,col||'#c2185b');ell(x+r*.3,y-r*.2,r*.2,r*.25,'#fff')}

function drawMon(m,x,y,s,flip,t,squash=1){
  ctx.save();ctx.translate(x,y);ctx.scale(s*(flip?-1:1)*squash,s/squash);
  const dk='#0003';
  if(m.t==='bat'){
    const fl=1+Math.sin(t*6)*.12;
    for(const sd of[-1,1]){
      ctx.save();ctx.scale(sd,fl);
      ctx.beginPath();ctx.moveTo(8,-10);ctx.bezierCurveTo(60,-85,125,-50,118,12);ctx.bezierCurveTo(98,2,88,22,66,34);ctx.bezierCurveTo(52,16,32,28,8,30);ctx.closePath();
      ctx.fillStyle=m.c1;ctx.fill();ctx.lineWidth=7;ctx.strokeStyle=m.c2;ctx.stroke();
      star(70,-18,7,m.c2);star(98,0,5,m.c2);star(46,8,5,m.c2);
      ctx.restore();
    }
    ell(0,12,24,34,m.c1,m.c2);ell(0,-24,19,17,m.c1,m.c2);
    ell(0,-22,10,9,'#f0e4ff');eye(-5,-24,3,'#e91e63');eye(5,-24,3,'#e91e63');
    ctx.beginPath();ctx.moveTo(-14,-36);ctx.lineTo(0,-52);ctx.lineTo(14,-36);ctx.fillStyle=m.c2;ctx.fill();
  }else if(m.t==='frog'){
    ell(-34,48,24,13,m.c1);ell(34,48,24,13,m.c1);ell(-34,48,8,8,'#fff');ell(34,48,8,8,'#fff');
    ell(0,6,34,46,m.c1);ell(0,18,17,27,'#e8f4ff');
    ell(-30,-4,9,24,m.c1);ell(30,-4,9,24,m.c1);
    ell(0,-48,29,26,m.c1);
    ctx.beginPath();ctx.moveTo(10,-62);ctx.lineTo(56,-108);ctx.lineTo(26,-42);ctx.closePath();ctx.fillStyle='#fff3d6';ctx.fill();
    ctx.beginPath();ctx.moveTo(-14,-66);ctx.lineTo(-32,-96);ctx.lineTo(-2,-70);ctx.closePath();ctx.fillStyle='#0f3aa8';ctx.fill();
    eye(-10,-50,6,m.c2);eye(11,-50,6,m.c2);
    ctx.save();ctx.translate(-4,-30);ctx.rotate(Math.sin(t*5)*.06);
    ctx.beginPath();ctx.ellipse(0,0,34,9,0,0,7);ctx.fillStyle=m.c2;ctx.fill();
    ctx.beginPath();ctx.moveTo(-24,0);ctx.quadraticCurveTo(-70,-8,-86,16);ctx.lineWidth=14;ctx.strokeStyle=m.c2;ctx.lineCap='round';ctx.stroke();ctx.restore();
  }else if(m.t==='fox'){
    ctx.beginPath();ctx.moveTo(26,20);ctx.bezierCurveTo(90,30,100,-40,64,-60);ctx.bezierCurveTo(70,-20,50,-5,26,0);ctx.fillStyle=m.c1;ctx.fill();
    ctx.beginPath();ctx.moveTo(64,-60);ctx.bezierCurveTo(78,-48,82,-40,86,-34);ctx.bezierCurveTo(74,-34,68,-44,64,-60);ctx.fillStyle=m.c2;ctx.fill();
    ell(0,16,32,40,m.c1);ell(0,26,18,26,m.c2);
    ell(-20,52,12,9,'#8a3a10');ell(20,52,12,9,'#8a3a10');
    for(const sd of[-1,1]){ctx.beginPath();ctx.moveTo(sd*10,-44);ctx.lineTo(sd*34,-84);ctx.lineTo(sd*34,-40);ctx.fillStyle=m.c1;ctx.fill();
      ctx.beginPath();ctx.moveTo(sd*16,-46);ctx.lineTo(sd*30,-72);ctx.lineTo(sd*30,-44);ctx.fillStyle=m.c2;ctx.fill()}
    ell(0,-34,32,26,m.c1);ell(0,-24,17,12,m.c2);eye(-11,-38,5,'#222');eye(11,-38,5,'#222');ell(0,-28,4,3,'#222');
  }else if(m.t==='mouse'){
    ctx.beginPath();ctx.moveTo(26,30);ctx.lineTo(60,10);ctx.lineTo(44,-6);ctx.lineTo(78,-34);ctx.lineWidth=9;ctx.strokeStyle=m.c1;ctx.lineJoin='round';ctx.stroke();
    ell(0,14,34,40,m.c1);ell(0,22,20,26,'#fff3b0');
    ell(-20,52,12,8,'#8a6a10');ell(20,52,12,8,'#8a6a10');
    for(const sd of[-1,1]){ell(sd*28,-70,12,30,m.c1);ell(sd*28,-86,12,12,'#222');ell(sd*32,-26,10,10,m.c2)}
    ell(0,-34,34,28,m.c1);eye(-12,-40,5,'#222');eye(12,-40,5,'#222');ell(0,-28,3,2,'#222');
  }else if(m.t==='turtle'){
    ell(-30,46,14,9,m.c1);ell(30,46,14,9,m.c1);
    ell(0,10,48,42,m.c2);ell(0,6,40,34,m.c1);
    ctx.strokeStyle='#ffffff88';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-40,6);ctx.lineTo(40,6);ctx.moveTo(0,-28);ctx.lineTo(0,40);ctx.stroke();
    ell(0,-44,22,20,m.c1);eye(-8,-47,4,'#222');eye(8,-47,4,'#222');
    ctx.beginPath();ctx.arc(0,-38,8,.2,Math.PI-.2);ctx.lineWidth=2;ctx.strokeStyle='#123';ctx.stroke();
  }
  ctx.restore();
}

/* ---------- Trạng thái ---------- */
let scene='battle',mode='menu',T=0,last=0,stage=0,caught=0;
let target,B,C,parts=[],floats=[],shake=0,keysDown={};

const rnd=(a,b)=>a+Math.random()*(b-a);
function burst(x,y,n,cols,sp=240){
  for(let i=0;i<n;i++){const a=rnd(0,7),v=rnd(40,sp);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:rnd(.4,.9),L:.9,c:cols[i%cols.length],r:rnd(3,8)})}
}
function floatText(x,y,s,c='#fff',size=30){floats.push({x,y,s,c,size,l:.9})}

function newBattle(){
  target=MONS[stage%4];  // Ếch Ninja là thú của người chơi, bốn thú còn lại luân phiên làm mục tiêu
  B={hp:100+stage*18,max:100+stage*18,time:25,gauge:0,spd:3.2+stage*.35,special:0,combo:0,
     lunge:0,hurt:0,lastA:-9,lastB:-9,fastest:0,dmgDone:0,over:false};
  mode=scene='battle';panel.hidden=true;
}
function startCatch(){
  const ratio=Math.max(0,B.time/25);
  C={balls:3,phase:'aim',t:0,t0:0,ratio,success:false,q:'',shrink:0,shakeN:0,perfect:false,rating:1};
  mode=scene='catch';
}

/* ---------- Bảng điều khiển ---------- */
function showMenu(){
  mode='menu';
  const names=Object.keys(dex);
  const next=MONS[stage%4];
  panel.hidden=false;
  panel.innerHTML=`<h1>Bắt Thú Sao</h1>
  <p>Đánh bại <b>${next.n}</b> bằng nút A và B, rồi ném bóng sao đúng lúc để bắt.</p>
  <button class="go" id="start">Chơi trò chơi</button>
  <p class="help">Điện thoại: chạm nút A và B (chạm cả hai cùng lúc để tung chiêu đặc biệt). Máy tính: phím Z, X hoặc Space.</p>
  ${names.length?`<div class="dex">${names.map(k=>`<span class="chip">${k} ${'★'.repeat(dex[k])}</span>`).join('')}</div>`:''}`;
  document.getElementById('start').onclick=()=>{beep(520,.1);beep(780,.15,'square',.05);newBattle()};
}
function showResult(win,msg,sub){
  mode='result';panel.hidden=false;
  panel.innerHTML=`<h1>${msg}</h1><p>${sub}</p><button class="go" id="again">${win?'Tiếp tục':'Thử lại'}</button>`;
  document.getElementById('again').onclick=()=>{if(win){stage++;caught=0;showMenu()}else{newBattle()}};
  document.getElementById('again').focus({preventScroll:true});
}

/* ---------- Điều khiển ---------- */
function pressA(){
  if(mode==='battle'&&!B.over){
    const now=T;B.lastA=now;
    if(Math.abs(B.lastB-now)<.16&&B.special>=100){special();return}
    const m=B.gauge,acc=1-Math.min(1,Math.abs(m-.5)*2);
    let q,dmg;
    if(acc>.84){q='Hoàn hảo!';dmg=18+B.combo*1.5;B.combo++;B.special=Math.min(100,B.special+22);beep(880,.1,'square',.06,300)}
    else if(acc>.5){q='Tốt!';dmg=11;B.combo++;B.special=Math.min(100,B.special+12);beep(620,.08)}
    else{q='Trượt';dmg=4;B.combo=0;beep(200,.12,'sawtooth',.04)}
    hit(dmg,q,q==='Hoàn hảo!'?'#ffe53a':q==='Tốt!'?'#8dffb0':'#ccc');
  }else if(mode==='catch'&&C.phase==='aim')throwBall();
}
function pressB(){
  if(mode==='battle'&&!B.over){
    B.lastB=T;
    if(Math.abs(B.lastA-T)<.16&&B.special>=100){special();return}
    B.special=Math.min(100,B.special+4);
    hit(5,'','#9fd4ff');beep(400,.05,'triangle');
  }else if(mode==='catch'&&C.phase==='aim')throwBall();
}
function special(){
  B.special=0;B.lastA=B.lastB=-9;beep(300,.4,'sawtooth',.07,900);
  hit(40,'Chiêu đặc biệt!','#ff7bd5',true);shake=.5;
}
function hit(d,txt,col,big){
  d=Math.round(d);B.hp=Math.max(0,B.hp-d);B.lunge=.22;B.hurt=.25;B.dmgDone+=d;
  const ex=330,ey=400;
  burst(ex,ey,big?40:14,['#ffe53a','#fff','#7fd3ff',col],big?420:260);
  floatText(ex+rnd(-30,30),ey-70,txt?txt:'-'+d,col,txt?32:24);
  if(txt&&!big)floatText(ex,ey-40,'-'+d,'#fff',22);
  if(B.hp<=0){B.over=true;B.overT=0;beep(660,.5,'triangle',.07,500)}
}
function throwBall(){
  const d=Math.abs(C.shrink-52);
  let q,p;
  if(d<9){q='Tuyệt vời!';p=.95;C.perfect=true}
  else if(d<22){q='Tốt!';p=.65}
  else{q='Hụt rồi';p=.22}
  p=Math.min(.98,p+(C.ratio-.4)*.2);
  C.q=q;C.success=Math.random()<p;C.phase='throw';C.t0=T;beep(500,.2,'triangle',.06,400);
  C.rating=Math.max(1,Math.min(5,1+Math.round(C.ratio*3)+(C.perfect?1:0)));
}
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='KeyZ'||e.code==='Space'){e.preventDefault();bA.classList.add('on');pressA()}
  if(e.code==='KeyX'){bB.classList.add('on');pressB()}
});
addEventListener('keyup',e=>{if(e.code==='KeyZ'||e.code==='Space')bA.classList.remove('on');if(e.code==='KeyX')bB.classList.remove('on')});
bA.addEventListener('pointerdown',e=>{e.preventDefault();pressA()});
bB.addEventListener('pointerdown',e=>{e.preventDefault();pressB()});
cv.addEventListener('pointerdown',()=>{if(mode==='catch')pressA()});

/* ---------- Cập nhật ---------- */
function update(dt){
  T+=dt;
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.l-=dt}
  parts=parts.filter(p=>p.l>0);
  for(const f of floats){f.y-=40*dt;f.l-=dt}
  floats=floats.filter(f=>f.l>0);
  shake=Math.max(0,shake-dt);
  if(mode==='battle'){
    B.gauge=(Math.sin(T*B.spd)+1)/2;
    B.lunge=Math.max(0,B.lunge-dt);B.hurt=Math.max(0,B.hurt-dt);
    if(!B.over){
      B.time-=dt;
      if(B.time<=0){B.time=0;B.over=true;B.overT=0;B.lost=true}
    }else{
      B.overT+=dt;
      if(B.overT>1.1&&mode==='battle'){
        if(B.lost)showResult(false,'Hết giờ!',`${target.n} đã chạy thoát. Thử lại nhé.`);
        else startCatch();
      }
    }
  }else if(mode==='catch'){
    if(C.phase==='aim')C.shrink=170-((T*1.0)%1.5)/1.5*150;
    else if(C.phase==='throw'){
      if(T-C.t0>.7){C.phase='shake';C.t0=T;burst(240,430,12,['#fff','#ffe53a'])}
    }else if(C.phase==='shake'){
      const k=(T-C.t0)/.55;
      if(k>=3){
        if(C.success){
          C.phase='won';C.t0=T;burst(240,430,60,RAINBOW,380);beep(660,.15);setTimeout(()=>beep(880,.15),150);setTimeout(()=>beep(1180,.3),300);
          caught=1;dex[target.n]=Math.max(dex[target.n]||0,C.rating);saveDex();
        }else{
          C.phase='out';C.t0=T;C.balls--;burst(240,430,16,['#fff','#9fd4ff']);beep(220,.3,'sawtooth',.05,-100);
        }
      }
    }else if(C.phase==='out'){
      if(T-C.t0>.8){
        if(C.balls<=0){C.phase='fled';C.t0=T}
        else{C.phase='aim';C.perfect=false}
      }
    }else if(C.phase==='won'){
      if(T-C.t0>1.6&&mode==='catch'){mode='result';showResult(true,`Bắt được ${target.n}!`,`Xếp hạng ${'★'.repeat(C.rating)}${'☆'.repeat(5-C.rating)}. Đã thêm vào bộ sưu tập của bạn.`)}
    }else if(C.phase==='fled'){
      if(T-C.t0>1&&mode==='catch'){mode='result';showResult(false,'Thú đã chạy mất',`Bạn đã dùng hết 3 bóng sao. Đánh lại ${target.n} nhé.`)}
    }
  }
}

/* ---------- Vẽ ---------- */
function bgScene(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a58d6');g.addColorStop(.5,'#6fb8ff');g.addColorStop(.62,'#b9e6ff');g.addColorStop(.63,'#5fc23f');g.addColorStop(1,'#2f8a2a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#ffffffcc';
  for(const [x,y,s] of [[90,300,1],[380,340,.8],[250,270,.6]]){const dx=Math.sin(T*.2+x)*10;ell(x+dx,y,50*s,18*s,'#ffffffbb');ell(x+dx+26*s,y-10*s,30*s,16*s,'#ffffffbb')}
  ctx.fillStyle='#3f9a4f';ctx.beginPath();ctx.moveTo(0,500);ctx.quadraticCurveTo(120,440,240,500);ctx.quadraticCurveTo(360,440,480,500);ctx.lineTo(480,520);ctx.lineTo(0,520);ctx.fill();
  for(let i=0;i<14;i++){const x=(i*77)%480,y=540+(i*53)%110;ell(x,y,4,4,i%2?'#ff9ec7':'#fff4a0')}
}
function banner(){
  ctx.save();
  ctx.fillStyle='#fff';roundRect(18,14,444,176,18);ctx.fill();
  ctx.fillStyle='var(--orange)';ctx.fillStyle='#f59a2a';roundRect(24,20,432,34,12);ctx.fill();
  ctx.font=`800 24px ${FONT}`;ctx.fillStyle='#fff';ctx.strokeStyle='#0008';ctx.lineWidth=4;ctx.textBaseline='middle';
  ctx.strokeText('Chơi trò chơi',40,38);ctx.fillText('Chơi trò chơi',40,38);
  const bg=ctx.createLinearGradient(0,56,0,146);bg.addColorStop(0,'#3a4fb8');bg.addColorStop(1,'#a35cd6');
  ctx.fillStyle=bg;ctx.fillRect(24,54,432,92);
  for(let i=0;i<40;i++){ctx.fillStyle='#ffffff22';ctx.fillRect((i*37)%432+24,54+(i*19)%92,3,3)}
  ctx.save();ctx.beginPath();ctx.rect(24,54,432,92);ctx.clip();
  drawMon(target,170,104,.55,false,T);
  ctx.restore();
  // thẻ sao
  ctx.save();ctx.translate(320,100);ctx.rotate(-.2);ctx.fillStyle='#eef0f8';roundRect(-40,-30,80,60,26);ctx.fill();
  for(let i=0;i<5;i++)star(-30+i*15,24,8,RAINBOW[i]);ctx.restore();
  ctx.fillStyle='#f59a2a';roundRect(24,146,432,38,12);ctx.fill();
  ctx.font=`800 28px ${FONT}`;ctx.textAlign='left';
  ctx.fillStyle='#fff';ctx.strokeStyle='#0009';ctx.lineWidth=5;
  ctx.strokeText('Bắt ',40,166);ctx.fillText('Bắt ',40,166);
  ctx.font=`800 34px ${FONT}`;const bw=ctx.measureText('Bắt ').width;
  ctx.font=`800 34px ${FONT}`;ctx.strokeText(target.n+'!',40+60,166);ctx.fillText(target.n+'!',40+60,166);
  ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function text(s,x,y,size,col,align='center',stroke='#0009'){
  ctx.font=`800 ${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.lineWidth=size/5;ctx.strokeStyle=stroke;ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function bar(x,y,w,h,v,col,bg='#000a'){ctx.fillStyle=bg;roundRect(x,y,w,h,h/2);ctx.fill();if(v>0){ctx.fillStyle=col;roundRect(x,y,Math.max(h,w*v),h,h/2);ctx.fill()}ctx.strokeStyle='#fff';ctx.lineWidth=2;roundRect(x,y,w,h,h/2);ctx.stroke()}
function counter(){
  ctx.fillStyle='#ff6b8b';roundRect(190,742,100,36,18);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
  text(`${caught}/1`,240,761,24,'#fff','center','#0006');
}
function gauge(){
  const x=60,y=668,w=360,h=26;
  ctx.fillStyle='#000a';roundRect(x,y,w,h,13);ctx.fill();
  ctx.fillStyle='#e8a82a88';ctx.fillRect(x+w*.3,y+3,w*.4,h-6);
  ctx.fillStyle='#4bd16acc';ctx.fillRect(x+w*.42,y+3,w*.16,h-6);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;roundRect(x,y,w,h,13);ctx.stroke();
  const mx=x+B.gauge*w;ctx.fillStyle='#fff';roundRect(mx-4,y-6,8,h+12,4);ctx.fill();
  text('Bấm A khi vạch trắng ở vùng xanh',240,656,16,'#fff');
  // thanh đặc biệt
  bar(60,708,360,12,B.special/100,B.special>=100?'#ff7bd5':'#7fd3ff');
  if(B.special>=100)text('Bấm A + B cùng lúc!',240,730,18,'#ffd0f2');
  else text('Special mode',240,730,15,'#fff');
}
function draw(){
  ctx.save();
  if(shake>0)ctx.translate(rnd(-6,6)*shake*2,rnd(-6,6)*shake*2);
  if(mode==='menu'){
    target=target||MONS[stage%4];target=MONS[stage%4];bgScene();banner();
    drawMon(PLAYER,150,560,1.5,false,T);
    counter();
  }else if(scene==='battle'){
    bgScene();banner();
    // thanh máu
    bar(60,206,360,16,B.hp/B.max,B.hp/B.max>.35?'#4bd16a':'#ff5a4b');
    text(`${target.n}`,64,238,16,'#fff','left');
    text(`${Math.ceil(B.time)}s`,420,238,18,B.time<6?'#ff8a8a':'#fff','right');
    // kẻ địch
    const bob=Math.sin(T*3)*6,eo=B.over&&!B.lost?B.overT:0;
    ctx.save();ctx.globalAlpha=Math.max(0,1-eo*.9);
    drawMon(target,338,420+bob-eo*60,1.45+(B.hurt>0?.08:0),true,T);
    ctx.restore();
    // người chơi
    const lx=B.lunge>0?Math.sin(B.lunge/.22*Math.PI)*90:0;
    drawMon(PLAYER,150+lx,560,1.5,false,T,B.lunge>0?.92:1);
    if(!B.over&&mode==='battle')gauge();
    counter();
  }else{
    bgScene();banner();
    drawCatch();counter();
  }
  // hạt & chữ nổi
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l/p.L);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}
  ctx.globalAlpha=1;
  for(const f of floats){ctx.globalAlpha=Math.min(1,f.l*2);text(f.s,f.x,f.y,f.size,f.c)}
  ctx.globalAlpha=1;
  ctx.restore();
}
function drawBall(x,y,r,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);
  ctx.beginPath();ctx.arc(0,0,r,Math.PI,0);ctx.fillStyle='#ff4b4b';ctx.fill();
  ctx.beginPath();ctx.arc(0,0,r,0,Math.PI);ctx.fillStyle='#fff';ctx.fill();
  ctx.lineWidth=r*.12;ctx.strokeStyle='#222';ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(r,0);ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,r*.3,0,7);ctx.fill();ctx.stroke();
  star(0,0,r*.2,'#ffd23f');ctx.restore();
}
function drawCatch(){
  const cx=240,cy=430;
  const ph=C.phase;
  if(ph==='aim'||ph==='out'||ph==='fled'){
    let sc=1.5,al=1,x=cx,y=cy+Math.sin(T*3)*5;
    if(ph==='out'){const k=Math.min(1,(T-C.t0)/.3);sc=1.5*k;}
    if(ph==='fled'){const k=Math.min(1,(T-C.t0)/1);al=1-k;x=cx+k*200;y-=k*160}
    ctx.save();ctx.globalAlpha=al;drawMon(target,x,y,sc,false,T);ctx.restore();
  }
  if(ph==='aim'){
    ctx.lineWidth=6;ctx.strokeStyle='#4bd16a';ctx.beginPath();ctx.arc(cx,cy,52,0,7);ctx.stroke();
    ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,Math.max(10,C.shrink),0,7);ctx.stroke();
    text('Chạm hoặc bấm A khi vòng trắng trùng vòng xanh',240,640,16,'#fff');
  }
  if(ph==='throw'){
    const k=Math.min(1,(T-C.t0)/.7),bx=cx,by=700+(cy-700)*k-Math.sin(k*Math.PI)*120;
    ctx.save();ctx.globalAlpha=1-k*.6;drawMon(target,cx,cy,1.5*(1-k*.8),false,T);ctx.restore();
    drawBall(bx,by,34-k*6,k*14);
    text(C.q,240,620,28,C.perfect?'#ffe53a':'#fff');
  }
  if(ph==='shake'){
    const k=(T-C.t0)/.55,w=Math.sin((k%1)*Math.PI*2)*(k<3?.5:0)*(1-Math.floor(k)*.2);
    drawBall(cx,cy+40,28,w);
  }
  if(ph==='won'){
    const k=Math.min(1,(T-C.t0)/.4);
    drawBall(cx,cy+40,28,0);
    text('Đã bắt được!',240,330,34,'#ffe53a');
    for(let i=0;i<5;i++)if(i<C.rating)star(240-60+i*30,380+Math.sin(T*6+i)*4,16*k,RAINBOW[i],Math.sin(T*3+i)*.3);
  }
  if(ph==='out')text('Thú đã thoát ra!',240,620,24,'#fff');
  // bóng còn lại
  for(let i=0;i<3;i++)drawBall(60+i*34,690,i<C.balls?13:13,0),i>=C.balls&&(ctx.fillStyle='#000a',ctx.beginPath(),ctx.arc(60+i*34,690,14,0,7),ctx.fill());
}

/* ---------- Vòng lặp ---------- */
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  update(dt);draw();requestAnimationFrame(frame);
}
target=MONS[0];showMenu();requestAnimationFrame(frame);
})();
</script>
